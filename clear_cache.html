<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cache Temizleme - Compound Pro</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #F97316 0%, #10B981 100%);
      color: white;
      text-align: center;
      padding: 20px;
    }
    .container {
      background: rgba(255, 255, 255, 0.95);
      color: #0F172A;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 500px;
    }
    h1 {
      margin: 0 0 20px 0;
      font-size: 28px;
      background: linear-gradient(135deg, #F97316 0%, #10B981 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status {
      margin: 20px 0;
      padding: 20px;
      background: #F0FDF4;
      border-radius: 8px;
      border-left: 4px solid #10B981;
    }
    button {
      background: linear-gradient(135deg, #F97316 0%, #10B981 100%);
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔄 Cache Temizleme</h1>
    <div class="status">
      <p id="status">Cache temizleniyor...</p>
    </div>
    <button onclick="goHome()">Ana Sayfaya Dön</button>
  </div>

  <script>
    // Tüm cache'i temizle
    localStorage.clear();
    sessionStorage.clear();
    
    document.getElementById('status').innerHTML = `
      ✅ Cache başarıyla temizlendi!<br><br>
      <strong>Compound Pro</strong> logosu artık görünecek.<br>
      Ana sayfaya gidin veya sayfayı yenileyin.
    `;

    function goHome() {
      window.location.href = '/index.html';
    }
  </script>
</body>
</html>
