<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090F"/>
      <stop offset="50%" stop-color="#0F1421"/>
      <stop offset="100%" stop-color="#161B2C"/>
    </linearGradient>
    <radialGradient id="glow-orange" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-sea" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="chart-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow-orange)"/>
  <rect width="1200" height="630" fill="url(#glow-sea)"/>
  
  <!-- Grid lines (subtle) -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
  </g>
  
  <!-- Logo/Brand mark -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="44" height="44" rx="10" fill="url(#title-gradient)"/>
    <text x="22" y="32" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-weight="900" font-size="24" fill="#FFFFFF">$</text>
    <text x="60" y="32" font-family="-apple-system, system-ui, sans-serif" font-weight="800" font-size="24" fill="#F1F5F9">Compound<tspan fill="#FB923C">Pro</tspan></text>
  </g>
  
  <!-- Main Title -->
  <text x="60" y="240" font-family="-apple-system, system-ui, sans-serif" font-weight="800" font-size="68" fill="#F1F5F9">Compound</text>
  <text x="60" y="320" font-family="-apple-system, system-ui, sans-serif" font-weight="800" font-size="68" fill="url(#title-gradient)">Interest Calculator</text>
  
  <!-- Subtitle -->
  <text x="60" y="380" font-family="-apple-system, system-ui, sans-serif" font-weight="500" font-size="26" fill="#94A3B8">7 Free Investment Calculators</text>
  <text x="60" y="412" font-family="-apple-system, system-ui, sans-serif" font-weight="500" font-size="26" fill="#94A3B8">Plan your wealth. Beat inflation. Retire early.</text>
  
  <!-- Decorative chart (compounding curve) -->
  <g transform="translate(700, 100)">
    <path d="M 0 380 Q 200 360 400 200 T 500 50" 
          stroke="url(#chart-line)" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.85"/>
    <circle cx="500" cy="50" r="8" fill="#10B981"/>
    <circle cx="500" cy="50" r="14" fill="#10B981" opacity="0.3"/>
    
    <!-- Data points -->
    <circle cx="100" cy="370" r="3" fill="#F97316"/>
    <circle cx="200" cy="350" r="3" fill="#F97316"/>
    <circle cx="300" cy="280" r="3" fill="#F97316"/>
    <circle cx="400" cy="200" r="3" fill="#F97316"/>
    
    <!-- Labels -->
    <text x="-20" y="80" font-family="monospace" font-size="14" fill="#94A3B8">$1M+</text>
    <text x="-20" y="380" font-family="monospace" font-size="14" fill="#94A3B8">$0</text>
  </g>
  
  <!-- Bottom badge -->
  <g transform="translate(60, 530)">
    <rect x="0" y="0" width="180" height="44" rx="22" fill="#161B2C" stroke="#F97316" stroke-width="1.5"/>
    <text x="90" y="28" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-weight="600" font-size="14" fill="#FB923C">★ FREE TOOLS</text>
  </g>
  
  <g transform="translate(260, 530)">
    <rect x="0" y="0" width="200" height="44" rx="22" fill="#161B2C" stroke="#10B981" stroke-width="1.5"/>
    <text x="100" y="28" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-weight="600" font-size="14" fill="#34D399">✓ NO SIGN-UP</text>
  </g>
  
  <g transform="translate(480, 530)">
    <rect x="0" y="0" width="180" height="44" rx="22" fill="#161B2C" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="90" y="28" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-weight="600" font-size="14" fill="#7DD3FC">📊 CHARTS</text>
  </g>
</svg>
